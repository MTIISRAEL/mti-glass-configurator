<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דמו - מסך אחד</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-size: 16px; }
    .fade-in { animation: fade .35s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <div class="bg-amber-100 text-amber-900 text-xs font-bold text-center py-1.5 border-b border-amber-200">דמו בלבד - לא האתר האמיתי</div>

  <!-- כותרת - כמו היום, בלי שורת הלשוניות -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-[1600px] mx-auto px-4 md:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="./mtilogo.jpg" alt="MTI" class="h-12 md:h-14 w-auto mix-blend-multiply" />
        <div class="hidden sm:block border-r border-slate-200 pr-4">
          <h1 class="text-lg md:text-xl font-bold text-slate-900 leading-tight">קטלוג דיגיטלי אינטראקטיבי</h1>
          <p class="text-xs md:text-sm text-slate-500 font-semibold">מחירון רשמי לצרכן 2026</p>
        </div>
      </div>
      <button onclick="resetAll()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold rounded-xl border border-slate-300">↻ איפוס</button>
    </div>

    <!-- פס מוצר נבחר - מופיע רק אחרי בחירה -->
    <div id="productBar" class="hidden border-t border-slate-100 bg-white">
      <div class="max-w-[1600px] mx-auto px-4 md:px-8 py-2 flex items-center gap-2 overflow-x-auto">
        <span class="text-xs font-bold text-slate-400 whitespace-nowrap ml-1">מוצר:</span>
        <div id="productChips" class="flex gap-1.5"></div>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-4 md:px-8 py-6 md:py-8">

    <!-- שלב 1: בחירת מוצר (מסך פתיחה) -->
    <section id="chooser" class="fade-in">
      <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-3xl p-6 md:p-8 text-white shadow-lg mb-6">
        <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold">שלב 1</span>
        <h2 class="text-2xl md:text-3xl font-bold mt-3">מה תרצו להזמין?</h2>
        <p class="text-blue-100 text-sm mt-1">בחרו מוצר, והמערכת תפתח את כל האפשרויות והמחיר בהתאם.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <button onclick="choose('showers')" class="group text-right bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-400 transition overflow-hidden focus:outline-none focus:ring-4 focus:ring-blue-200">
          <div class="h-52 md:h-64 bg-slate-100 overflow-hidden">
            <img src="./MTI-721/MTI-721%20(111).jpeg" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="" />
          </div>
          <div class="p-5 flex items-center justify-between">
            <div>
              <h3 class="text-xl font-bold text-slate-900">מקלחונים ומחיצות</h3>
              <p class="text-sm text-slate-500 mt-0.5">בהתאמה אישית למידה · זכוכית ופרזול לבחירה</p>
            </div>
            <span class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition">←</span>
          </div>
        </button>

        <button onclick="choose('baths')" class="group text-right bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-400 transition overflow-hidden focus:outline-none focus:ring-4 focus:ring-blue-200">
          <div class="h-52 md:h-64 bg-slate-100 overflow-hidden">
            <img src="./%D7%AA%D7%95%D7%A1%D7%A4%D7%95%D7%AA%20%D7%90%D7%9E%D7%91%D7%98%D7%99%D7%94/%D7%A4%D7%90%D7%A0%D7%9C%20%D7%97%D7%99%D7%A4%D7%95%D7%99%20%D7%93%D7%A7%D7%95%D7%A8%D7%98%D7%99%D7%91%D7%99.jpeg" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="" />
          </div>
          <div class="p-5 flex items-center justify-between">
            <div>
              <h3 class="text-xl font-bold text-slate-900">אמבטיות וג'קוזי</h3>
              <p class="text-sm text-slate-500 mt-0.5">70 דגמים · מערכות BASIC ו-TITANIUM</p>
            </div>
            <span class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition">←</span>
          </div>
        </button>

        <button onclick="choose('trays')" class="group text-right bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-400 transition overflow-hidden focus:outline-none focus:ring-4 focus:ring-blue-200">
          <div class="h-52 md:h-64 bg-gradient-to-br from-slate-100 to-slate-200 flex flex-col items-center justify-center gap-2 text-slate-400">
            <svg viewBox="0 0 120 60" class="w-40"><rect x="6" y="18" width="108" height="30" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="14" y="24" width="92" height="18" rx="3" fill="#f1f5f9"/><circle cx="60" cy="33" r="4" fill="#94a3b8"/></svg>
            <span class="text-xs font-bold">כאן תבוא תמונה של אגנית</span>
          </div>
          <div class="p-5 flex items-center justify-between">
            <div>
              <h3 class="text-xl font-bold text-slate-900">אגניות למקלחון</h3>
              <p class="text-sm text-slate-500 mt-0.5">מוצר מדף · אספקה מהירה</p>
            </div>
            <span class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition">←</span>
          </div>
        </button>
      </div>
    </section>

    <!-- שלבים 2+ : נפתח לפי המוצר -->
    <section id="configurator" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8"></section>
  </main>

  <script>
    const PRODUCTS = {
      showers: { name: 'מקלחונים ומחיצות', icon: '🚿',
        steps: ['סוג מקלחון', 'דגם מקלחון', 'מידות (ס"מ)', 'מפרט פרזול וזכוכית'] },
      baths:   { name: "אמבטיות וג'קוזי", icon: '🛁',
        steps: ['סגנון וצורת האמבטיה', 'דגם ומידת אמבטיה', "רמת איבזור ומערכת ג'קוזי", 'קונסטרוקציה', 'אביק / פיית מילוי', 'תוספות'] },
      trays:   { name: 'אגניות למקלחון', icon: '◽',
        steps: ['סדרה', 'דגם ומידה', 'תוספות'] }
    };

    function chips(active) {
      document.getElementById('productChips').innerHTML = Object.entries(PRODUCTS).map(([id, p]) => {
        const on = id === active;
        return `<button onclick="choose('${id}')" class="px-3.5 py-1.5 rounded-xl text-sm font-bold whitespace-nowrap transition ${on
          ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${p.icon} ${p.name}${on ? ' ✓' : ''}</button>`;
      }).join('');
    }

    function choose(id) {
      const p = PRODUCTS[id];
      document.getElementById('chooser').classList.add('hidden');
      document.getElementById('productBar').classList.remove('hidden');
      chips(id);

      const steps = p.steps.map((s, i) => `
        <div class="py-5 ${i ? 'border-t border-slate-100' : ''}">
          <div class="flex items-center gap-2 mb-3">
            <span class="w-7 h-7 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center shadow-sm">${i + 2}</span>
            <h3 class="font-bold text-slate-900">${s}</h3>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            ${[1,2,3,4].map(() => '<div class="h-14 rounded-2xl border border-slate-200 bg-slate-50"></div>').join('')}
          </div>
        </div>`).join('');

      const el = document.getElementById('configurator');
      el.innerHTML = `
        <div class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 shadow-sm p-6 md:p-8 fade-in">
          <p class="text-xs font-bold text-blue-600 mb-1">${p.icon} ${p.name}</p>
          <p class="text-sm text-slate-400 mb-2">בדמו השלבים מוצגים כמקום בלבד - באתר האמיתי כאן יופיעו כל הבחירות הקיימות היום</p>
          ${steps}
        </div>
        <aside class="lg:col-span-5 space-y-6 fade-in">
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 h-72 flex items-center justify-center text-slate-400 text-sm">תמונה / הדמיה של הדגם</div>
          <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-6 space-y-4">
            <span class="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 border border-blue-100 text-blue-700 text-xs font-bold rounded-full">● סיכום הזמנה</span>
            <p class="text-xl font-extrabold text-slate-400">יש להשלים את כל שלבי הבחירה</p>
            <button disabled class="w-full py-4 bg-slate-100 text-slate-400 font-extrabold rounded-2xl border border-slate-200">הורדת טופס הזמנה (PDF)</button>
          </div>
        </aside>`;
      el.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetAll() {
      document.getElementById('configurator').classList.add('hidden');
      document.getElementById('productBar').classList.add('hidden');
      document.getElementById('chooser').classList.remove('hidden');
    }
  </script>
</body>
</html>
