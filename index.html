        <div class="hidden sm:block border-r border-slate-200 pr-4">
          <h1 class="text-base font-bold text-slate-900 leading-tight">קונפיגורטור מקלחונים ומחיצות</h1>
          <p class="text-xs text-slate-500 font-medium">מחירון רשמי לצרכן 2025</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="resetConfigurator()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-bold rounded-xl border border-slate-300 transition cursor-pointer">

          </svg>
          <span>איפוס</span>
        </button>

        <span class="hidden md:inline-flex items-center gap-1.5 px-3 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full border border-blue-200">
          מערכת מחירון חכמה
        </span>
      </div>
    </div>
  </header>

        <select id="categorySelect" onchange="onCategoryChange()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition">
          <option value="" disabled selected>-- בחר סוג מקלחון --</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-800 mb-2">2. דגם מקלחון</label>
        <select id="modelSelect" onchange="onModelChange()" disabled class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl font-semibold text-slate-400 outline-none text-sm transition cursor-not-allowed">
          <option value="" disabled selected>-- יש לבחור סוג מקלחון תחילה --</option>
        </select>
      </div>
