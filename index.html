<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קונפיגורטור מקלחונים - MTI Bath Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Assistant', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-extrabold text-xl shadow-inner">M</div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">MTI Bath Gallery</h1>
          <p class="text-xs text-slate-500 font-medium">מחירון מקלחונים ומחיצות 2025</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 text-slate-600 text-xs font-semibold rounded-full border border-slate-200">
        התאמה אישית
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- פנל הגדרות מוצר -->
    <section class="lg:col-span-7 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6">
      
      <!-- שלב 1: סוג מקלחון ראשי -->
      <div>
        <label class="block text-sm font-bold text-slate-800 mb-2">1. סוג מקלחון</label>
        <select id="categorySelect" onchange="onCategoryChange()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none text-sm transition">
          <option value="" disabled selected>-- בחר סוג מקלחון --</option>
        </select>
      </div>

      <!-- שלב 2: דגם ספציפי -->
      <div>
        <label class="block text-sm font-bold text-slate-800 mb-2">2. דגם מקלחון</label>
        <select id="modelSelect" onchange="onModelChange()" disabled class="w-full p-3 bg-slate-100 border border-slate-200 rounded-xl font-semibold text-slate-400 outline-none text-sm transition cursor-not-allowed">
          <option value="" disabled selected>-- יש לבחור סוג מקלחון תחילה --</option>
        </select>
      </div>

      <!-- שלב 3: מידות -->
      <div id="dimensionsSection" class="border-t pt-4 space-y-4 opacity-50 pointer-events-none transition-opacity">
        <h3 class="text-sm font-bold text-slate-800">3. מידות (ס"מ)</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/60">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-semibold text-slate-500">רוחב / אורך</span>
              <span id="wDisplay" class="text-sm font-bold text-blue-600">--</span>
            </div>
            <select id="widthSelect" onchange="calculatePrice()" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500">
              <option value="" disabled selected>-- בחר רוחב --</option>
            </select>
          </div>

          <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200/60">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-semibold text-slate-500">גובה</span>
              <span id="hDisplay" class="text-sm font-bold text-blue-600">--</span>
            </div>
            <select id="heightSelect" onchange="calculatePrice()" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-500">
              <option value="140">140 ס"מ</option>
              <option value="150">150 ס"מ</option>
              <option value="160">160 ס"מ</option>
              <option value="170">170 ס"מ</option>
              <option value="180">180 ס"מ</option>
              <option value="190" selected>190 ס"מ (סטנדרט)</option>
              <option value="200">200 ס"מ</option>
              <option value="210">210 ס"מ</option>
              <option value="220">220 ס"מ</option>
            </select>
          </div>
        </div>
      </div>

      <!-- שלב 4: גימורים ושדרוגים -->
      <div id="optionsSection" class="border-t pt-4 space-y-4 opacity-50 pointer-events-none transition-opacity">
        <h3 class="text-sm font-bold text-slate-800">4. מפרט פרזול וזכוכית</h3>
        
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-semibold text-slate-600">גוון פרזול</label>
            <span id="selectedColorBadge" class="text-xs font-bold text-slate-400">טרם נבחר גוון</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="colorContainer"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">סוג זכוכית (8 מ"מ)</label>
            <select id="glassSelect" onchange="calculatePrice()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none">
              <option value="0">שקופה (בסיס)</option>
              <option value="220">אקסטרה קליר (+220 ₪)</option>
              <option value="185">גרניט (+185 ₪)</option>
              <option value="190">פפיטה (+190 ₪)</option>
              <option value="250">אנטי סאן (+250 ₪)</option>
              <option value="220">אסיד (+220 ₪)</option>
              <option value="230">פסים בהתזת חול (+230 ₪)</option>
              <option value="320">גלינה שקופה (+320 ₪)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">ציפוי ננו דוחה אבנית</label>
            <select id="nanoSelect" onchange="calculatePrice()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold outline-none">
              <option value="0">ללא ציפוי</option>
              <option value="150">כולל ציפוי ננו (+150 ₪)</option>
            </select>
          </div>
        </div>

        <div class="bg-blue-50/60 p-3.5 rounded-2xl border border-blue-100 flex items-center justify-between">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="installCheck" onchange="calculatePrice()" class="w-4 h-4 text-blue-600 rounded accent-blue-600" checked>
            <span class="text-xs font-bold text-slate-800">התקנה ומדידה מקצועית (600 ₪ ישירות למתקין)</span>
          </label>
        </div>
      </div>
    </section>

    <!-- פנל תצוגת GIF וסיכום מחיר -->
    <section class="lg:col-span-5 flex flex-col gap-6">
      
      <!-- הדמיית GIF מתוך המאגר המקומי ב-GitHub -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">הדמיית פתיחה</span>
          <span id="currentModelBadge" class="text-xs px-2.5 py-1 bg-slate-100 text-slate-700 font-bold rounded-lg truncate max-w-[200px]">טרם נבחר דגם</span>
        </div>
        
        <div class="w-full h-64 bg-slate-50 rounded-2xl border border-dashed border-slate-200 flex items-center justify-center p-2 relative overflow-hidden">
          <img id="showerGif" src="" alt="הדמיית מקלחון" class="max-h-full max-w-full object-contain hidden" />
          <div id="gifPlaceholder" class="flex flex-col items-center justify-center text-slate-400 gap-2">
            <svg class="w-10 h-10 stroke-current opacity-40" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <span class="text-xs font-semibold">בחר דגם לצפייה בהנפשה</span>
          </div>
        </div>
      </div>

      <!-- פירוט מחיר סופי -->
      <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-lg space-y-4">
        <div class="flex justify-between items-baseline">
          <span class="text-slate-400 text-sm font-medium">סה״כ לתשלום (כולל מע״מ)</span>
          <span id="finalPriceDisplay" class="text-3xl font-extrabold text-blue-400">0 ₪</span>
        </div>
        
        <div class="text-xs text-slate-400 border-t border-slate-800 pt-3 space-y-1">
          <div class="flex justify-between">
            <span>מחיר לפני מע"מ:</span>
            <span id="subTotalDisplay" class="text-slate-300 font-semibold">0 ₪</span>
          </div>
          <div class="flex justify-between">
            <span>מע"מ (18%):</span>
            <span id="vatDisplay" class="text-slate-300 font-semibold">0 ₪</span>
          </div>
        </div>

        <button id="whatsappBtn" onclick="sendOrderWhatsApp()" disabled class="w-full py-3.5 bg-slate-700 opacity-50 cursor-not-allowed text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-sm transition">
          <span>שליחת מפרט והזמנה ב-WhatsApp</span>
        </button>
      </div>

    </section>
  </main>

        { cat: "אמבטיון סגירה מלאה חזיתי", id: "772", name: "MTI-772 - קבוע ודלת", base: 275, file: "MTI_772_animated.gif", widths: [95,100,105,110,115,120,125,130,135,140,145,150,155,160,165,170,175,180] },
        { cat: "אמבטיון סגירה מלאה פינתי", id: "781", name: "MTI-781 - שני קבועים ודלת", base: 385, file: "MTI_781_animated_fix1.gif", widths: [70,75,80,85,90,95,100,105,110,115,120,125,130] },
        { cat: "אמבטיון סגירה מלאה פינתי", id: "782", name: "MTI-782 - שני קבועים ושתי דלתות", base: 563, file: "MTI_782_animated_fix1.gif", widths: [70,75,80,85,90,95,100,105,110,115,120,125,130,135,140] },

        // הזזה
        { cat: "מקלחון הזזה צינור חזיתי", id: "800", name: "MTI-800 - קבוע ודלת", base: 450, file: "MTI_800_animated.gif", widths: [100,110,120,130,140,150,160,170,180] },
        { cat: "מקלחון הזזה צינור חזיתי", id: "801", name: "MTI-801 - שני קבועים ודלת", base: 550, file: "MTI_801_animated.gif", widths: [140,150,160,170,180,190,200] },
        { cat: "מקלחון הזזה צינור חזיתי", id: "840", name: "MTI-840 - אמבטיון קבוע ודלת", base: 450, file: "MTI_840_animated.gif", widths: [100,110,120,130,140,150,160,170,180] },
        { cat: "מקלחון הזזה צינור חזיתי", id: "841", name: "MTI-841 - אמבטיון 2 קבועים ודלת", base: 550, file: "MTI_841_animated.gif", widths: [140,150,160,170,180,190,200] },
        { cat: "מקלחון הזזה מסילה מוסתרת חזיתי", id: "880", name: "MTI-880 - חזית קבוע ודלת", base: 380, file: "MTI_820_animated.gif", widths: [100,110,120,130,140,150,160,170,180] },
        { cat: "מקלחון הזזה מסילה מוסתרת פינתי", id: "881", name: "MTI-881 - פינתי 2 קבועים ודלת", base: 244, file: "MTI_821_animated.gif", widths: [70,80,90,100,110,120] },
        { cat: "מקלחון הזזה מסילה מוסתרת פינתי", id: "882", name: "MTI-882 - פינתי 2 קבועים ו-2 דלתות", base: 380, file: "MTI_821_animated.gif", widths: [70,80,90,100,110,120] }
      ],
      colors: [
        { name: "ניקל", mult: 1.0, hex: "#cbd5e1" },
        { name: "שחור מט", mult: 1.2, hex: "#0f172a" },
        { name: "ניקל מוברש", mult: 1.2, hex: "#94a3b8" },
        { name: "זהב מוברש", mult: 1.35, hex: "#f59e0b" },
        { name: "גרפיט", mult: 1.35, hex: "#475569" },
        { name: "ברונזה אדומה", mult: 1.35, hex: "#b45309" },
        { name: "לבן", mult: 1.4, hex: "#f8fafc" },
        { name: "זהב מושחר", mult: 1.4, hex: "#78350f" }
      ]
    };

    let selectedColor = null; // ברירת מחדל: ללא צבע נבחר

    function init() {
      const catSelect = document.getElementById('categorySelect');
      catSelect.innerHTML = '<option value="" disabled selected>-- בחר סוג מקלחון --</option>' + 
        CATALOG_DATA.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

      const colorBox = document.getElementById('colorContainer');
      colorBox.innerHTML = CATALOG_DATA.colors.map((col, idx) => `
        <button type="button" onclick="selectColor(${idx})" class="color-btn border-slate-200 p-2 border rounded-xl flex items-center gap-2 text-right transition">
          <span class="w-3.5 h-3.5 rounded-full border shadow-sm flex-shrink-0" style="background-color: ${col.hex}"></span>
          <span class="text-xs font-semibold text-slate-700 truncate">${col.name}</span>
        </button>
      `).join('');
    }

    function onCategoryChange() {
      const selectedCat = document.getElementById('categorySelect').value;
      const modelSelect = document.getElementById('modelSelect');
      const filteredModels = CATALOG_DATA.models.filter(m => m.cat === selectedCat);
      
      modelSelect.disabled = false;
      modelSelect.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed');
      modelSelect.classList.add('bg-slate-50', 'text-slate-800');
      
      modelSelect.innerHTML = '<option value="" disabled selected>-- בחר דגם מקלחון --</option>' + 
        filteredModels.map(m => `<option value="${m.id}">${m.name}</option>`).join('');

      // איפוס צבע
      selectedColor = null;
      document.getElementById('selectedColorBadge').innerText = 'טרם נבחר גוון';
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('border-blue-600', 'bg-blue-50/50');
        b.classList.add('border-slate-200');
      });

      document.getElementById('dimensionsSection').classList.add('opacity-50', 'pointer-events-none');
      document.getElementById('optionsSection').classList.add('opacity-50', 'pointer-events-none');
      document.getElementById('currentModelBadge').innerText = 'טרם נבחר דגם';
      document.getElementById('wDisplay').innerText = '--';
      document.getElementById('hDisplay').innerText = '--';
      document.getElementById('finalPriceDisplay').innerText = '0 ₪';
      document.getElementById('subTotalDisplay').innerText = '0 ₪';
      document.getElementById('vatDisplay').innerText = '0 ₪';
      
      const waBtn = document.getElementById('whatsappBtn');
      waBtn.disabled = true;
      waBtn.className = "w-full py-3.5 bg-slate-700 opacity-50 cursor-not-allowed text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-sm transition";

      const img = document.getElementById('showerGif');
      const placeholder = document.getElementById('gifPlaceholder');
      img.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }

    function onModelChange() {
      const modelId = document.getElementById('modelSelect').value;
      const model = CATALOG_DATA.models.find(m => m.id === modelId);
      if (!model) return;

      document.getElementById('currentModelBadge').innerText = model.name;
      document.getElementById('dimensionsSection').classList.remove('opacity-50', 'pointer-events-none');
      document.getElementById('optionsSection').classList.remove('opacity-50', 'pointer-events-none');

      const widthSelect = document.getElementById('widthSelect');
      widthSelect.innerHTML = model.widths.map((w, idx) => `<option value="${w}" ${idx === 0 ? 'selected' : ''}>${w} ס"מ</option>`).join('');
      
      const heightSelect = document.getElementById('heightSelect');
      heightSelect.value = "190";

      const waBtn = document.getElementById('whatsappBtn');
      waBtn.disabled = false;
      waBtn.className = "w-full py-3.5 bg-green-500 hover:bg-green-600 active:scale-[0.98] text-white font-bold rounded-2xl flex items-center justify-center gap-2 shadow-sm transition cursor-pointer";

      updateGif(model);
      calculatePrice();
    }

    function updateGif(model) {
      const img = document.getElementById('showerGif');
      const placeholder = document.getElementById('gifPlaceholder');
      
      if (model.file) {
        img.src = `./${model.file}`;
        img.classList.remove('hidden');
        placeholder.classList.add('hidden');
        
        img.onerror = () => {
          img.classList.add('hidden');
          placeholder.classList.remove('hidden');
        };
      } else {
        img.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    function selectColor(index) {
      selectedColor = CATALOG_DATA.colors[index];
      document.getElementById('selectedColorBadge').innerText = selectedColor.name;
      
      const buttons = document.querySelectorAll('.color-btn');
      buttons.forEach((btn, idx) => {
        if (idx === index) {
          btn.classList.add('border-blue-600', 'bg-blue-50/50');
          btn.classList.remove('border-slate-200');
        } else {
          btn.classList.remove('border-blue-600', 'bg-blue-50/50');
          btn.classList.add('border-slate-200');
        }
      });
      calculatePrice();
    }

    function calculatePrice() {
      const modelId = document.getElementById('modelSelect').value;
      const model = CATALOG_DATA.models.find(m => m.id === modelId);
      if (!model) return;

      const width = parseFloat(document.getElementById('widthSelect').value) || 80;
      const height = parseFloat(document.getElementById('heightSelect').value) || 190;
      const glassExtra = parseFloat(document.getElementById('glassSelect').value) || 0;
      const nanoExtra = parseFloat(document.getElementById('nanoSelect').value) || 0;
      const hasInstall = document.getElementById('installCheck').checked;

      document.getElementById('wDisplay').innerText = width + ' ס"מ';
      document.getElementById('hDisplay').innerText = height + ' ס"מ';

      let basePrice = (model.base * 10) + ((width - 60) * 8);
      
      // אם לא נבחר צבע, המקדם הוא 1.0 (בסיס)
      let colorMult = selectedColor ? selectedColor.mult : 1.0;
      let hardwareMarkup = basePrice * (colorMult - 1);
      
      let subTotal = basePrice + hardwareMarkup + glassExtra + nanoExtra;
      let vat = Math.round(subTotal * 0.18);
      let total = subTotal + vat + (hasInstall ? 600 : 0);

      document.getElementById('subTotalDisplay').innerText = Math.round(subTotal).toLocaleString() + ' ₪';
      document.getElementById('vatDisplay').innerText = vat.toLocaleString() + ' ₪';
      document.getElementById('finalPriceDisplay').innerText = total.toLocaleString() + ' ₪';
    }

    function sendOrderWhatsApp() {
      const modelName = document.getElementById('currentModelBadge').innerText;
      const width = document.getElementById('widthSelect').value;
      const height = document.getElementById('heightSelect').value;
      const glass = document.getElementById('glassSelect').options[document.getElementById('glassSelect').selectedIndex].text;
      const colorName = selectedColor ? selectedColor.name : 'טרם נבחר (בסיס ניקל)';
      const price = document.getElementById('finalPriceDisplay').innerText;

      const msg = `שלום MTI, ברצוני לקבל הצעת מחיר עבור:\n*דגם:* ${modelName}\n*מידות:* ${width}x${height} ס"מ\n*פרזול:* ${colorName}\n*זכוכית:* ${glass}\n*סה"כ משוער:* ${price}`;
      window.open(`https://wa.me/972500000000?text=${encodeURIComponent(msg)}`, '_blank');
    }

    window.onload = init;
  </script>
</body>
