<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קונפיגורטור מקלחונים - MTI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Assistant', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">M</div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">MTI Bath Gallery</h1>
          <p class="text-xs text-slate-500">קונפיגורטור מקלחונים ומחיצות זכוכית 2025</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-green-50 text-green-700 text-xs font-semibold rounded-full border border-green-200">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> מחובר ל-Google Sheets
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- טופס הגדרות -->
    <section class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
      <h2 class="text-lg font-bold text-slate-800 border-b pb-3">1. בחירת דגם ותצורה</h2>
      
      <div>
        <label class="block text-sm font-semibold mb-2">דגם מקלחון</label>
        <select id="modelSelect" onchange="calculate()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="138|חזית דלת בודדת|single">MTI-718 - דלת חזיתית</option>
          <option value="241|חזית קבוע ודלת|fixed_door">MTI-721 - קבוע ודלת</option>
          <option value="275|חזית שתי דלתות|double_door">MTI-722 - שתי דלתות</option>
          <option value="275|פינתי שתי דלתות|corner">MTI-740 - פינתי שתי דלתות</option>
          <option value="270|הזזה CNC חזית|sliding">MTI-830 - הזזה CNC חזיתי</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2">רוחב (ס"מ): <span id="wVal" class="text-blue-600">80</span></label>
          <input type="range" id="widthInput" min="50" max="200" value="80" oninput="updateDimensions()" class="w-full accent-blue-600">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">גובה (ס"מ): <span id="hVal" class="text-blue-600">190</span></label>
          <input type="range" id="heightInput" min="140" max="220" value="190" oninput="updateDimensions()" class="w-full accent-blue-600">
        </div>
      </div>

      <h2 class="text-lg font-bold text-slate-800 border-b pb-3 pt-2">2. גימורים ושדרוגים</h2>
      
      <div>
        <label class="block text-sm font-semibold mb-2">גוון פרזול</label>
        <div class="grid grid-cols-3 gap-2" id="colorOptions">
          <button type="button" onclick="setColor(1.0, 'ניקל', this)" class="color-btn active p-2 border rounded-xl flex items-center gap-2 border-blue-600 bg-blue-50/50">
            <span class="w-4 h-4 rounded-full bg-slate-300 border"></span>
            <span class="text-xs font-semibold">ניקל (בסיס)</span>
          </button>
          <button type="button" onclick="setColor(1.2, 'שחור מט', this)" class="color-btn p-2 border rounded-xl flex items-center gap-2 border-slate-200">
            <span class="w-4 h-4 rounded-full bg-slate-900 border"></span>
            <span class="text-xs font-semibold">שחור מט (+20%)</span>
          </button>
          <button type="button" onclick="setColor(1.35, 'זהב מוברש', this)" class="color-btn p-2 border rounded-xl flex items-center gap-2 border-slate-200">
            <span class="w-4 h-4 rounded-full bg-amber-400 border"></span>
            <span class="text-xs font-semibold">זהב (+35%)</span>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2">סוג זכוכית (8 מ"מ)</label>
          <select id="glassSelect" onchange="calculate()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="0">שקופה (ללא תוספת)</option>
            <option value="220">אקסטרה קליר (+220 ₪)</option>
            <option value="185">גרניט (+185 ₪)</option>
            <option value="230">פסים התזת חול (+230 ₪)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">ציפוי ננו דוחה אבנית</label>
          <select id="nanoSelect" onchange="calculate()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="0">ללא ציפוי</option>
            <option value="150">כולל ציפוי ננו (+150 ₪)</option>
          </select>
        </div>
      </div>

      <div class="pt-2">
        <label class="inline-flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="installCheck" onchange="calculate()" class="w-4 h-4 text-blue-600 rounded accent-blue-600" checked>
          <span class="text-sm font-medium">כולל מדידה והתקנה מקצועית (+600 ₪)</span>
        </label>
      </div>
    </section>

    <!-- שרטוט וסיכום מחיר -->
    <section class="lg:col-span-5 flex flex-col gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">שרטוט אינטראקטיבי</span>
          <span id="modelBadge" class="text-xs px-2.5 py-0.5 bg-slate-100 text-slate-700 font-semibold rounded-md">חזית דלת בודדת</span>
        </div>
        
        <!-- קנבס שרטוט דינמי -->
        <div class="w-full h-64 bg-slate-50 rounded-xl border border-dashed border-slate-200 flex items-center justify-center p-4 relative">
          <svg id="showerSvg" viewBox="0 0 300 240" class="w-full h-full max-h-56"></svg>
        </div>
      </div>

      <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-sm space-y-4">
        <div class="flex justify-between items-baseline">
          <span class="text-slate-400 text-sm">מחיר כולל מע״מ</span>
          <span id="totalPrice" class="text-3xl font-extrabold text-blue-400">0 ₪</span>
        </div>
        <p class="text-xs text-slate-400 border-t border-slate-800 pt-3">מחיר סופי משוער. לא כולל חיתוכים מיוחדים או מדרגות.</p>
        <button onclick="sendWhatsApp()" class="w-full py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition">
          <span>שליחת הצעת מחיר ב-WhatsApp</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    let colorMultiplier = 1.0;
    let selectedColorName = 'ניקל';

    function setColor(mult, name, btn) {
      colorMultiplier = mult;
      selectedColorName = name;
      document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('border-blue-600', 'bg-blue-50/50');
        b.classList.add('border-slate-200');
      });
      btn.classList.add('border-blue-600', 'bg-blue-50/50');
      calculate();
    }

    function updateDimensions() {
      document.getElementById('wVal').innerText = document.getElementById('widthInput').value;
      document.getElementById('hVal').innerText = document.getElementById('heightInput').value;
      calculate();
    }

    function drawShower(type, w, h) {
      const svg = document.getElementById('showerSvg');
      let content = '';
      const glassColor = "#e2e8f0";
      const strokeColor = "#334155";
      
      if (type === 'single') {
        content = `
          <rect x="100" y="30" width="100" height="170" fill="${glassColor}" stroke="${strokeColor}" stroke-width="2" rx="2" fill-opacity="0.6"/>
          <circle cx="185" cy="115" r="4" fill="${strokeColor}"/>
          <rect x="98" y="50" width="4" height="15" fill="${strokeColor}"/>
          <rect x="98" y="165" width="4" height="15" fill="${strokeColor}"/>
          <text x="150" y="220" font-size="11" text-anchor="middle" fill="#64748b">${w} ס"מ</text>
          <text x="75" y="120" font-size="11" text-anchor="middle" fill="#64748b" transform="rotate(-90 75 120)">${h} ס"מ</text>
        `;
      } else if (type === 'fixed_door') {
        content = `
          <rect x="60" y="30" width="80" height="170" fill="${glassColor}" stroke="${strokeColor}" stroke-width="2" rx="2" fill-opacity="0.4"/>
          <rect x="142" y="30" width="100" height="170" fill="${glassColor}" stroke="${strokeColor}" stroke-width="2" rx="2" fill-opacity="0.7"/>
          <circle cx="225" cy="115" r="4" fill="${strokeColor}"/>
          <line x1="60" y1="30" x2="140" y2="30" stroke="#0ea5e9" stroke-width="3"/>
          <text x="150" y="220" font-size="11" text-anchor="middle" fill="#64748b">${w} ס"מ</text>
        `;
      } else {
        content = `
          <rect x="50" y="30" width="98" height="170" fill="${glassColor}" stroke="${strokeColor}" stroke-width="2" rx="2" fill-opacity="0.6"/>
          <rect x="152" y="30" width="98" height="170" fill="${glassColor}" stroke="${strokeColor}" stroke-width="2" rx="2" fill-opacity="0.6"/>
          <circle cx="135" cy="115" r="4" fill="${strokeColor}"/>
          <circle cx="165" cy="115" r="4" fill="${strokeColor}"/>
          <text x="150" y="220" font-size="11" text-anchor="middle" fill="#64748b">${w} ס"מ</text>
        `;
      }
      svg.innerHTML = content;
    }

    function calculate() {
      const modelData = document.getElementById('modelSelect').value.split('|');
      const basePoints = parseFloat(modelData[0]);
      const modelName = modelData[1];
      const modelType = modelData[2];

      document.getElementById('modelBadge').innerText = modelName;

      const width = parseFloat(document.getElementById('widthInput').value);
      const height = parseFloat(document.getElementById('heightInput').value);
      const glassExtra = parseFloat(document.getElementById('glassSelect').value);
      const nanoExtra = parseFloat(document.getElementById('nanoSelect').value);
      const isInstall = document.getElementById('installCheck').checked;

      // חישוב מחיר
      let base = (basePoints * 10) + ((width - 80) * 12);
      let hardwareCost = base * (colorMultiplier - 1);
      let total = (base + hardwareCost + glassExtra + nanoExtra);
      if (isInstall) total += 600;
      total = Math.round(total * 1.18); // כולל מע״מ

      document.getElementById('totalPrice').innerText = total.toLocaleString() + ' ₪';
      drawShower(modelType, width, height);
    }

    function sendWhatsApp() {
      const text = `שלום MTI, ברצוני לקבל הצעת מחיר עבור מקלחון:\n- דגם: ${document.getElementById('modelBadge').innerText}\n- מידות: רוחב ${document.getElementById('widthInput').value} ס"מ, גובה ${document.getElementById('heightInput').value} ס"מ\n- פרזול: ${selectedColorName}\n- מחיר משוער: ${document.getElementById('totalPrice').innerText}`;
      window.open(`https://wa.me/972500000000?text=${encodeURIComponent(text)}`, '_blank');
    }

    calculate();
  </script>
</body>
</html>
