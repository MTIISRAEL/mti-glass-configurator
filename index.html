<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קונפיגורטור מקלחונים - MTI Bath Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: 'Assistant', sans-serif; font-size: 16px; }
    #pdfTemplate {
      font-family: Arial, Tahoma, sans-serif !important;
      word-spacing: 3px;
      letter-spacing: 0px;
    }
    #pdfTemplate * { box-sizing: border-box; }
    
    /* עיצוב עדין לפס הגלילה האופקי בגלרייה */
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">
  
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-[1600px] w-full mx-auto px-4 md:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="./mtilogo.jpg" alt="MTI ISRAEL" class="h-12 md:h-16 w-auto object-contain" />

        <div class="hidden sm:block border-r border-slate-200 pr-4">
          <h1 class="text-lg md:text-xl font-extrabold text-slate-900 leading-tight">קונפיגורטור מקלחונים ומחיצות</h1>
          <p class="text-xs md:text-sm text-slate-500 font-semibold">מחירון רשמי 2026</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="resetConfigurator()" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-sm font-bold rounded-xl border border-slate-300 transition cursor-pointer shadow-sm">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          <span>איפוס</span>
        </button>

        <span class="hidden md:inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-blue-50 text-blue-700 text-sm font-bold rounded-full border border-blue-200">
          מערכת מחירון חכמה
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] w-full mx-auto px-4 md:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start flex-1">
    
    <section class="lg:col-span-7 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6">
      
      <div>
        <label class="block text-base font-bold text-slate-800 mb-2">1. סוג מקלחון <span class="text-red-500">*</span></label>
        <select id="categorySelect" onchange="onCategoryChange()" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none text-sm md:text-base transition">
          <option value="" disabled selected>-- בחר סוג מקלחון --</option>
        </select>
      </div>

      <div>
        <label class="block text-base font-bold text-slate-800 mb-2">2. דגם מקלחון <span class="text-red-500">*</span></label>
        <select id="modelSelect" onchange="onModelChange()" disabled class="w-full p-3.5 bg-slate-100 border border-slate-200 rounded-xl font-bold text-slate-400 outline-none text-sm md:text-base transition cursor-not-allowed">
          <option value="" disabled selected>-- יש לבחור סוג מקלחון תחילה --</option>
        </select>
      </div>

      <div id="dimensionsSection" class="border-t pt-5 space-y-4 opacity-50 pointer-events-none transition-opacity">
        <h3 class="text-base font-extrabold text-slate-800">3. מידות (ס"מ) <span class="text-red-500">*</span></h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="dimGrid">
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/60" id="dimBox1">
            <div class="flex justify-between items-center mb-1.5">
              <span id="dimLabel1" class="text-xs md:text-sm font-bold text-slate-500">רוחב חזית</span>
              <span id="wDisplay1" class="text-xs md:text-sm font-extrabold text-blue-600">--</span>
            </div>
            <select id="widthSelect1" onchange="calculatePrice()" class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
              <option value="" disabled selected>-- בחר רוחב --</option>
            </select>
          </div>

          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/60 hidden" id="dimBox2">
            <div class="flex justify-between items-center mb-1.5">
              <span class="text-xs md:text-sm font-bold text-slate-500">עומק (צלע ב')</span>
              <span id="wDisplay2" class="text-xs md:text-sm font-extrabold text-blue-600">--</span>
            </div>
            <select id="widthSelect2" onchange="calculatePrice()" class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
              <option value="" disabled selected>-- בחר עומק --</option>
            </select>
          </div>

          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/60" id="heightBox">
            <div class="flex justify-between items-center mb-1.5">
              <span class="text-xs md:text-sm font-bold text-slate-500">גובה</span>
              <span id="hDisplay" class="text-xs md:text-sm font-extrabold text-blue-600">--</span>
            </div>
            <select id="heightSelect" onchange="calculatePrice()" class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500">
              <option value="" disabled selected>-- בחר גובה --</option>
              <option value="140">140 ס"מ</option>
              <option value="150">150 ס"מ</option>
              <option value="160">160 ס"מ</option>
              <option value="170">170 ס"מ</option>
              <option value="180">180 ס"מ</option>
              <option value="190">190 ס"מ (סטנדרט)</option>
              <option value="200">200 ס"מ</option>
              <option value="210">210 ס"מ</option>
              <option value="220">220 ס"מ</option>
              <option value="230">230 ס"מ (חריג)</option>
              <option value="240">240 ס"מ (חריג)</option>
              <option value="250">250 ס"מ (חריג)</option>
              <option value="260">260 ס"מ (חריג)</option>
            </select>
          </div>
        </div>
      </div>

      <div id="optionsSection" class="border-t pt-5 space-y-6 opacity-50 pointer-events-none transition-opacity">
        <h3 class="text-base font-extrabold text-slate-800">4. מפרט פרזול וזכוכית</h3>
        
        <div>
          <div class="flex justify-between items-center mb-2.5">
            <label class="block text-sm md:text-base font-bold text-slate-700">גוון פרזול <span class="text-red-500">*</span></label>
            <span id="selectedColorBadge" class="text-xs md:text-sm font-extrabold text-slate-400">טרם נבחר גוון</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5 md:gap-3" id="colorContainer"></div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2.5">
            <label class="block text-sm md:text-base font-bold text-slate-700">סוג זכוכית (8 מ"מ) <span class="text-red-500">*</span></label>
            <span id="selectedGlassBadge" class="text-xs md:text-sm font-extrabold text-slate-400">טרם נבחר סוג זכוכית</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5 md:gap-3" id="glassContainer"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-3 border-t border-slate-100">
          
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-sm font-bold text-slate-700">ציפוי ננו דוחה אבנית <span class="text-red-500">*</span></label>
              <span id="selectedNanoBadge" class="text-xs font-bold text-slate-400">טרם נבחר</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5" id="nanoCards">
              <button type="button" onclick="selectNano(0)" class="nano-card bg-slate-50 border border-slate-200 p-3 rounded-2xl flex items-center gap-2.5 hover:border-blue-400 transition cursor-pointer text-right">
                <span class="w-4 h-4 rounded-full border border-slate-300 flex items-center justify-center bg-white check-dot"><span class="w-2 h-2 rounded-full bg-blue-60
